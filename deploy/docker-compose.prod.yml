# Production stack, copied to the VM by .github/workflows/deploy.yml. It never builds:
# the image comes from OCIR. TLS is served by money-space's Caddy over the shared `edge` network.
services:
  backend:
    image: ${BACKEND_IMAGE}
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
    # Loopback only: the public path is Caddy -> edge network; this port is for the deploy's health probe.
    ports:
      - '127.0.0.1:${APP_PORT:-3001}:3000'
    networks:
      default:
      edge:
        aliases: [vocab-backend]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    external: true
